<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance · Yrashka</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, transparent 40%), radial-gradient(circle at 80% 70%, #16213e 0%, transparent 40%);
      padding: 20px;
    }
    .maintenance-card {
      background: rgba(20, 20, 30, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid #2a2a3a;
      border-radius: 32px;
      padding: 60px 48px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .maintenance-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 70% 30%, rgba(0, 212, 255, 0.03) 0%, transparent 50%);
      pointer-events: none;
    }
    .icon-wrapper {
      background: #12121a;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      border: 2px solid #2a2a3a;
      position: relative;
    }
    .icon-wrapper span {
      font-size: 56px;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff, #a0a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }
    .subtitle {
      font-size: 1.3rem;
      color: #aaa;
      margin-bottom: 24px;
      font-weight: 400;
    }
    .message {
      font-size: 1.1rem;
      color: #888;
      margin-bottom: 40px;
      line-height: 1.6;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      background: rgba(18, 18, 26, 0.6);
      padding: 16px 24px;
      border-radius: 60px;
      border: 1px solid #2a2a3a;
    }
    .info-grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px 0 20px;
      flex-wrap: wrap;
    }
    .info-item {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 16px 24px;
      min-width: 140px;
    }
    .info-label {
      display: block;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .info-value {
      display: block;
      font-size: 20px;
      font-weight: 600;
      color: #00d4ff;
    }
    .footer {
      margin-top: 50px;
      text-align: center;
      font-size: 13px;
      color: #666;
      padding-top: 30px;
      border-top: 1px solid #2a2a3a;
    }
    .footer a {
      color: #00d4ff;
      text-decoration: none;
    }
    @media (max-width: 768px) {
      .maintenance-card {
        padding: 40px 30px;
      }
      h1 {
        font-size: 2.5rem;
      }
      .icon-wrapper {
        width: 100px;
        height: 100px;
      }
      .icon-wrapper span {
        font-size: 48px;
      }
    }
    @media (max-width: 480px) {
      .maintenance-card {
        padding: 30px 20px;
      }
      h1 {
        font-size: 2rem;
      }
      .subtitle {
        font-size: 1.1rem;
      }
      .icon-wrapper {
        width: 80px;
        height: 80px;
      }
      .icon-wrapper span {
        font-size: 40px;
      }
      .info-grid {
        flex-direction: column;
        align-items: center;
      }
      .info-item {
        width: 100%;
        max-width: 250px;
      }
    }
  </style>
</head>
<body>
  <div class="maintenance-card">
    <div class="icon-wrapper">
      <span>🔧⚙️</span>
    </div>
    <h1>Under Maintenance</h1>
    <div class="subtitle">Site is temporarily unavailable</div>
    <p class="message">
      <i class="fa-regular fa-clock" style="margin-right: 8px; color: #00d4ff;"></i>
      We'll be back shortly
    </p>
    <div class="info-grid">
      <div class="info-item">
      </div>
      <div class="info-item">
        <span class="info-label">Status</span>
        <span class="info-value">In progress</span>
      </div>
    </div>
    <div class="footer">
      <span><i class="fa-regular fa-message"></i> Questions? <a href="#">@Yrashka200</a></span>
    </div>
  </div>
</body>
</html>
