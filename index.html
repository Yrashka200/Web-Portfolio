<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yrashka · new design</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0f;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 20% 20%, #1a1a2e 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #16213e 0%, transparent 40%);
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
        }
        
        .card {
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #2a2a3a;
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.7);
        }
        
        .icon {
            font-size: 70px;
            color: #00d4ff;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .badge {
            display: inline-block;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 40px;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        
        .message {
            color: #ccc;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }
        
        .feature {
            background: #151520;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 15px 5px;
        }
        
        .feature i {
            font-size: 24px;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        
        .feature span {
            display: block;
            font-size: 13px;
            color: #aaa;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            color: white;
            font-size: 20px;
            font-weight: 600;
            padding: 18px 50px;
            border-radius: 60px;
            text-decoration: none;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(123, 47, 247, 0.4);
            width: 100%;
            letter-spacing: 0.5px;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(123, 47, 247, 0.6);
        }
        
        .btn i {
            font-size: 24px;
            transition: transform 0.3s;
        }
        
        .btn:hover i {
            transform: translateX(8px);
        }
        
        .note {
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }
        
        .note a {
            color: #00d4ff;
            text-decoration: none;
        }
        
        .note a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .features {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .btn {
                font-size: 18px;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        
      
        <div class="icon">
            <i class="fa-regular fa-sparkles"></i>
        </div>
        
        
        <div class="badge">
            ✦ NEW DESIGN ✦
        </div>
        
        
        <h1>Fresh Look,<br>Same Yrashka</h1>
        
        
        <div class="message">
            I've redesigned my portfolio with a cleaner,<br>
            more minimalistic look. Everything is now<br>
            in one card — simple and fast.
        </div>

        
    <div class="profile">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/259258104?v=4" alt="Yrashka">
        <h1>Yrashka</h1>
        <p class="tag">Junior Python Developer · Open Source</p>
    </div>



       
        <div class="features">
            <div class="feature">
                <i class="fa-regular fa-layer-group"></i>
                <span>One card</span>
            </div>
            <div class="feature">
                <i class="fa-regular fa-bolt"></i>
                <span>Faster</span>
            </div>
            <div class="feature">
                <i class="fa-regular fa-mobile"></i>
                <span>Mobile first</span>
            </div>
        </div>
        
        
        <a href="menu.html" class="btn">
            Let's go <i class="fa-regular fa-arrow-right"></i>
        </a>
        

</body>
</html>
